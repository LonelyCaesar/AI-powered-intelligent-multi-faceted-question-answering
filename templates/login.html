<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - AI-多維度智慧問答</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light login-body">

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="col-12 col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <h3 class="fw-bold mb-0"><i class="bi bi-robot me-2"></i>AI-多維度智慧問答</h3>
                <small class="text-white-50">AI-Powered Intelligent Multi-faceted Question Answering</small>
            </div>
            <div class="card-body p-5">
                <h5 class="text-center mb-4 fw-bold text-muted">系統登入</h5>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show rounded-pill small py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close pb-1 pt-2" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="custom-floating-field mb-4">
                        <input type="text" id="username" name="username" placeholder=" " required autofocus>
                        <label for="username">帳號</label>
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="custom-floating-field mb-4">
                        <input type="password" id="password" name="password" placeholder=" " required>
                        <label for="password">密碼</label>
                        <i class="bi bi-key"></i>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold shadow-sm mt-2">登入系統</button>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted"><i class="bi bi-info-circle me-1"></i>Portfolio Demo Use Only</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
